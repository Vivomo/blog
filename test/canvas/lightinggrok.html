<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighting Grok</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #020308; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    let stars = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      makeStars();
    }
    window.addEventListener('resize', resize);

    function makeStars() {
      stars = [];
      const count = Math.floor(W * H / 5500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.3 + 0.15,
          a: Math.random() * 0.55 + 0.15,
          tw: Math.random() * Math.PI * 2
        });
      }
    }

    function rand(a, b) {
      return a + Math.random() * (b - a);
    }

    function buildBranch(x, y, angle, length, width, alpha, depth, segments) {
      if (depth <= 0 || length < 8 || alpha < 0.05 || width < 0.35) return;

      const steps = Math.max(4, Math.floor(length / 12));
      const stepLen = length / steps;
      let cx = x, cy = y, ca = angle;
      let branched = 0;
      const maxBranches = depth >= 4 ? rand(1, 3) | 0 : depth >= 2 ? (Math.random() < 0.7 ? 1 : 0) : 0;

      for (let i = 0; i < steps; i++) {
        ca += rand(-0.42, 0.42);
        const pull = Math.PI / 2 - ca;
        ca += pull * rand(0.06, 0.14);

        const nx = cx + Math.cos(ca) * stepLen;
        const ny = cy + Math.sin(ca) * stepLen;

        segments.push({
          x1: cx, y1: cy, x2: nx, y2: ny,
          width, alpha, depth
        });

        const progress = i / steps;
        const canBranch = branched < maxBranches
          && progress > 0.15
          && progress < 0.85
          && Math.random() < 0.18 + depth * 0.04;

        if (canBranch) {
          branched++;
          const side = Math.random() < 0.5 ? -1 : 1;
          const bias = Math.random() < 0.35 ? side * rand(0.15, 0.4) : 0;
          const branchAngle = ca + side * rand(0.35, 1.15) + bias;
          buildBranch(
            nx, ny,
            branchAngle,
            length * rand(0.28, 0.58),
            width * rand(0.35, 0.55),
            alpha * rand(0.4, 0.62),
            depth - 1,
            segments
          );
        }

        cx = nx;
        cy = ny;
        if (ny > H + 40) break;
      }
    }

    function createBolt() {
      const segments = [];
      const startX = rand(W * 0.18, W * 0.82);
      buildBranch(
        startX, -20,
        Math.PI / 2 + rand(-0.28, 0.28),
        H * rand(0.88, 1.12),
        rand(5, 7.5),
        1,
        6,
        segments
      );
      return { segments, originX: startX };
    }

    let bolt = null;
    let boltStart = 0;
    let flickerPlan = [];
    let nextBoltTime = performance.now() + 600;

    function planFlicker() {
      flickerPlan = [];
      const flickers = 2 + (Math.random() < 0.55 ? 1 : 0);
      let t = 0;
      flickerPlan.push({ start: t, end: t + rand(70, 110), level: 1 });
      t = flickerPlan[0].end;
      for (let i = 0; i < flickers; i++) {
        t += rand(35, 100);
        const on = rand(45, 95);
        flickerPlan.push({ start: t, end: t + on, level: rand(0.5, 0.92) });
        t += on;
      }
      const fadeDur = rand(160, 280);
      flickerPlan.push({ start: t, end: t + fadeDur, level: -1 });
    }

    function boltIntensity(elapsed) {
      for (const p of flickerPlan) {
        if (elapsed >= p.start && elapsed < p.end) {
          if (p.level === -1) {
            const k = 1 - (elapsed - p.start) / (p.end - p.start);
            return 0.45 * k * k;
          }
          const k = (elapsed - p.start) / (p.end - p.start);
          return p.level * (1 - k * 0.2);
        }
      }
      return elapsed >= flickerPlan[flickerPlan.length - 1].end ? -1 : 0;
    }

    function drawNightSky(now, glow, originX) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#030512');
      grad.addColorStop(0.55, '#060a1c');
      grad.addColorStop(1, '#0a0e28');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      for (const s of stars) {
        const tw = 0.65 + 0.35 * Math.sin(now / 800 + s.tw);
        ctx.globalAlpha = s.a * tw * (1 - glow * 0.35);
        ctx.fillStyle = '#c8d4ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (glow > 0.01) {
        ctx.fillStyle = `rgba(140, 165, 255, ${glow * 0.16})`;
        ctx.fillRect(0, 0, W, H);
        const ox = originX != null ? originX : W / 2;
        const sky = ctx.createRadialGradient(ox, 0, 0, ox, H * 0.15, H * 0.95);
        sky.addColorStop(0, `rgba(190, 210, 255, ${glow * 0.32})`);
        sky.addColorStop(0.45, `rgba(120, 150, 255, ${glow * 0.12})`);
        sky.addColorStop(1, 'rgba(100, 130, 255, 0)');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawBolt(segments, intensity) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.save();
      ctx.shadowColor = 'rgba(130, 165, 255, 0.95)';
      ctx.shadowBlur = 28 * intensity;
      for (const s of segments) {
        ctx.strokeStyle = `rgba(110, 150, 255, ${s.alpha * intensity * 0.45})`;
        ctx.lineWidth = s.width * 2.8;
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
      }
      ctx.restore();

      for (const s of segments) {
        const t = Math.min(1, s.alpha);
        const r = Math.floor(255 - (1 - t) * 70);
        const g = Math.floor(255 - (1 - t) * 45);
        const b = 255;
        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${s.alpha * intensity})`;
        ctx.lineWidth = Math.max(0.4, s.width * intensity);
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
      }

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const s of segments) {
        if (s.depth < 4) continue;
        ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha * intensity * 0.55})`;
        ctx.lineWidth = Math.max(0.3, s.width * 0.35 * intensity);
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function loop(now) {
      let glow = 0;
      let intensity = 0;
      let originX = null;

      if (bolt) {
        const elapsed = now - boltStart;
        intensity = boltIntensity(elapsed);
        if (intensity === -1) {
          bolt = null;
          nextBoltTime = now + rand(1400, 4000);
          intensity = 0;
        } else {
          glow = intensity;
          originX = bolt.originX;
        }
      } else if (now >= nextBoltTime) {
        bolt = createBolt();
        boltStart = now;
        planFlicker();
        intensity = 1;
        glow = 1;
        originX = bolt.originX;
      }

      drawNightSky(now, glow, originX);
      if (bolt && intensity > 0) drawBolt(bolt.segments, intensity);

      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
